name: Release

# release: <default> (release title)
# dispatch (all): Manual release for $target_release_tag
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual release for {0}', inputs.target_release_tag) || '' }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: The tag of the release you want to append the artifact to
        type: string
        required: true


jobs:
  show_action_parameters:
    runs-on: ubuntu-latest
    steps:
      - name: Show action parameters
        run: |
          cat <<EOF > $GITHUB_STEP_SUMMARY
          ## Action Parameters
          - target_release_tag: \`${{ github.event.inputs.target_release_tag }}\`
          EOF

  # test:
  #   uses: ./.github/workflows/test.yml

  build:
    # needs:
    #   - test
    uses: ./.github/workflows/build.yml
    # secrets: inherit

  release:
    needs:
      - build
    runs-on: ubuntu-latest

    # allow the upload step to add assets to the release
    # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Upload the jar to the GitHub release
        run: |
          FILE_PATH=$(find build-artifacts -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)
          gh release upload "$TAG" "$FILE_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.target_release_tag }}
